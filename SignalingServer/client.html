<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>WebRTC 브라우저</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background-color: #f5f5f5;
    }
    .container {
      text-align: center;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    textarea {
      resize: none;
    }
    input {
      width: 300px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>브라우저 WebRTC 클라이언트</h2>
    <textarea id="chat" rows="10" cols="50" readonly></textarea><br /><br />
    <input id="input" type="text" placeholder="메시지 입력" />
    <button onclick="send()">전송</button>
  </div>

  <script>
    // HTML 요소 참조
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    let peer;                // WebRTC 피어 객체
    let dataChannel;         // DataChannel 참조
    let isOfferCreated = false; // 중복 offer 방지 플래그

    // WebSocket 연결 (시그널링 서버)
    const ws = new WebSocket("ws://localhost:8080/ws");

    // WebSocket 연결되었을 때
    ws.onopen = () => {

      chat.value += "[WebSocket 연결됨]\n";
      
      // 연결 초기화
      initializePeerConnection(); 
    };

    // WebSocket 메시지 수신 처리
    ws.onmessage = async (event) => {
      const msg = JSON.parse(event.data);

      // 상대방의 offer 수신 시
      if (msg.type === "offer") {

        // 피어가 없으면 생성
        if (!peer) initializePeerConnection(); 

         // 상대 offer 설정
        await peer.setRemoteDescription(new RTCSessionDescription(msg));

        // answer 생성
        const answer = await peer.createAnswer();    

        // 로컬에 설정
        await peer.setLocalDescription(answer);      

        // 서버에 전송
        ws.send(JSON.stringify({ type: "answer", sdp: answer.sdp })); 
      }

      // 상대방의 answer 수신 시
      else if (msg.type === "answer") {

        // answer 설정
        await peer.setRemoteDescription(new RTCSessionDescription(msg)); 
      }

      // ICE 후보 수신 시
      else if (msg.type === "candidate") {
        try {
          // ICE 후보 추가
          await peer.addIceCandidate(new RTCIceCandidate(msg.candidate)); 
        } catch (e) {
          console.error("ICE 후보 추가 실패:", e);
        }
      }
    };

    // 피어 연결 및 이벤트 설정 함수
    function initializePeerConnection() {

      // 피어 연결 구성 (Google STUN 서버 사용)
      peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      });

      // ICE 후보가 생기면 서버에 전송
      peer.onicecandidate = event => {
        if (event.candidate) {
          ws.send(JSON.stringify({ type: "candidate", candidate: event.candidate }));
        }
      };

      // 게스트인 경우, 상대가 만든 DataChannel을 수신
      peer.ondatachannel = event => {
        dataChannel = event.channel;
        setupDataChannel();
      };

      // 호스트가 offer를 한 번만 생성하도록 조건 설정
      if (!isOfferCreated) {

        // 채팅 채널 생성
        createDataChannel();  

        // offer 생성
        createOffer();     
           
        isOfferCreated = true;
      }
    }

    // DataChannel 생성 및 이벤트 설정 (호스트 전용)
    function createDataChannel() {

      // 채팅용 채널 생성
      dataChannel = peer.createDataChannel("chat"); 

      // DataChannel 이벤트 설정
      setupDataChannel();
    }

    // DataChannel 이벤트 설정
    function setupDataChannel() {
      dataChannel.onopen = () => {
        chat.value += "[DataChannel 열림]\n";
      };
      dataChannel.onmessage = e => {
        chat.value += "상대: " + e.data + "\n";
      };
    }

    // offer 생성 및 전송 (호스트 역할)
    async function createOffer() {

      // offer SDP 생성
      const offer = await peer.createOffer();    
      
      // 로컬에 설정
      await peer.setLocalDescription(offer);     
      
      // 서버에 전송
      ws.send(JSON.stringify({ type: "offer", sdp: offer.sdp })); 
    }

    // 전송 버튼 클릭 시 메시지 전송
    function send() {
      const message = input.value;
      if (dataChannel && dataChannel.readyState === "open") {

        // 메시지 전송
        dataChannel.send(message);      
        
        // 내 채팅 표시
        chat.value += "나: " + message + "\n";    
        
        // 입력창 초기화
        input.value = "";                            
      }
    }
  </script>
</body>
</html>
