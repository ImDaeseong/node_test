<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebRTC 메시지 교환</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
    }
    .container {
      background: #fff;
      padding: 20px;
      width: 100vw;
      height: 100vh;
      box-sizing: border-box;
    }
    textarea, input, button {
      width: 100%;
      margin-top: 10px;
      box-sizing: border-box;
    }
    textarea {
      height: 150px;
      resize: none;
    }
    button {
      padding: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>브라우저 WebRTC 클라이언트</h2>
    <textarea id="chat" rows="10" cols="50" readonly></textarea><br /><br />
    <input id="input" type="text" placeholder="메시지 입력" />
    <button onclick="send()">전송</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");

    let peer;
    let dataChannel;
    let isOfferCreated = false;
    let ws;
    let wsReconnectAttempts = 0;
    let peerReconnectAttempts = 0;
    const MAX_WS_RECONNECT = 5;
    const MAX_PEER_RECONNECT = 3;

    // WebSocket 연결 함수 (자동 재접속 지원)
    function connectWebSocket() {
      ws = new WebSocket("ws://localhost:8080/ws");

      ws.onopen = () => {
        wsReconnectAttempts = 0;
        chat.value += "[WebSocket 연결됨]\n";
        initializePeerConnection();
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === "offer") {

          if (!peer) initializePeerConnection();

          try {
            await peer.setRemoteDescription(new RTCSessionDescription(msg));
            const answer = await peer.createAnswer();
            await peer.setLocalDescription(answer);
            ws.send(JSON.stringify({ type: "answer", sdp: answer.sdp }));
          } catch (e) {
            chat.value += "[오류] offer 처리 실패: " + e + "\n";
            retryPeerConnection();
          }
        } else if (msg.type === "answer") {

          try {
            await peer.setRemoteDescription(new RTCSessionDescription(msg));
          } catch (e) {
            chat.value += "[오류] answer 처리 실패: " + e + "\n";
            retryPeerConnection();
          }
        } else if (msg.type === "candidate") {

          try {
            await peer.addIceCandidate(new RTCIceCandidate(msg.candidate));
          } catch (e) {
            chat.value += "[오류] ICE 후보 추가 실패: " + e + "\n";
          }
        }
      };

      ws.onerror = (e) => {
        chat.value += "[WebSocket 오류]\n";
      };

      ws.onclose = () => {

        chat.value += "[WebSocket 연결 종료]\n";

        if (wsReconnectAttempts < MAX_WS_RECONNECT) {
          setTimeout(() => {
            wsReconnectAttempts++;
            chat.value += `[WebSocket 재접속 시도 ${wsReconnectAttempts}]\n`;
            connectWebSocket();
          }, 2000);
        } else {
          chat.value += "[WebSocket 재접속 횟수 초과]\n";
        }
      };
    }

    // PeerConnection 재시도 로직
    function retryPeerConnection() {

      if (peerReconnectAttempts < MAX_PEER_RECONNECT) {
        peerReconnectAttempts++;
        chat.value += `[WebRTC 재연결 시도 ${peerReconnectAttempts}]\n`;
        closePeerConnection();
        setTimeout(() => {
          initializePeerConnection();
        }, 1500);
      } else {
        chat.value += "[WebRTC 재연결 횟수 초과]\n";
      }
    }

    // PeerConnection 및 DataChannel 종료
    function closePeerConnection() {
      try {
        if (dataChannel) {
          dataChannel.close();
          dataChannel = null;
        }
        if (peer) {
          peer.close();
          peer = null;
        }
        isOfferCreated = false;
      } catch (e) {
        chat.value += "[Peer 종료 오류]: " + e + "\n";
      }
    }

    // PeerConnection 및 이벤트 설정
    function initializePeerConnection() {

      closePeerConnection();
      
      peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      });

      peer.onicecandidate = event => {
        if (event.candidate && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: "candidate", candidate: event.candidate }));
        }
      };

      peer.ondatachannel = event => {
        dataChannel = event.channel;
        setupDataChannel();
      };

      peer.onconnectionstatechange = () => {
        if (peer.connectionState === "failed" || peer.connectionState === "disconnected") {
          chat.value += "[WebRTC 연결 끊김, 재시도]\n";
          retryPeerConnection();
        }
      };

      if (!isOfferCreated && ws.readyState === 1) {
        createDataChannel();
        createOffer();
        isOfferCreated = true;
      }
    }

    function createDataChannel() {
      dataChannel = peer.createDataChannel("chat");
      setupDataChannel();
    }

    function setupDataChannel() {
      dataChannel.onopen = () => {
        chat.value += "[DataChannel 열림]\n";
        peerReconnectAttempts = 0; // 성공시 재연결 카운트 초기화
      };
      dataChannel.onmessage = e => {
        chat.value += "상대: " + e.data + "\n";
      };
      dataChannel.onerror = (e) => {
        chat.value += "[DataChannel 오류]: " + e + "\n";
        retryPeerConnection();
      };
      dataChannel.onclose = () => {
        chat.value += "[DataChannel 종료]\n";
      };
    }

    async function createOffer() {
      try {
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);
        ws.send(JSON.stringify({ type: "offer", sdp: offer.sdp }));
      } catch (e) {
        chat.value += "[Offer 생성 오류]: " + e + "\n";
        retryPeerConnection();
      }
    }

    function send() {
      const message = input.value;
      if (dataChannel && dataChannel.readyState === "open") {
        dataChannel.send(message);
        chat.value += "나: " + message + "\n";
        input.value = "";
      } else {
        chat.value += "[전송 실패] DataChannel이 열려있지 않습니다.\n";
      }
    }

    // 페이지 로드시 WebSocket 연결 시작
    connectWebSocket();

    // 페이지 이탈 시 정리
    window.addEventListener("beforeunload", () => {
      if (ws) ws.close();
      closePeerConnection();
    });
  </script>
</body>
</html>
